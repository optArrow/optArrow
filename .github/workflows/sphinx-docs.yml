name: Build and Deploy Sphinx Docs

on:
  push:
    branches:
      - gh-pages
    paths:
      - 'Documentation/**'
      - '.github/workflows/sphinx-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Documentation/requirements.txt

      - name: Build docs
        run: sphinx-build -b html Documentation Documentation/_build/html

      - name: Sync built docs to branch root
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='Documentation/' \
            --exclude='.github/' \
            Documentation/_build/html/ ./

      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated-site changes to commit."
            exit 0
          fi
          git commit -m "docs: rebuild site from rst [skip ci]"
          git push
